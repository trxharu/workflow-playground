name: GitHub Actions Demo
run-name: Deployment on ${{ inputs.environment }} by ${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment Name"
        required: true
        type: environment
jobs:
  Demo-Action:
    runs-on: self-hosted
    environment: ${{ inputs.environment }}
    steps:
      - run: echo "The ${{ github.repository }} repository has been cloned to the runner."
      - run: echo "Deploying on ${{ inputs.environment }}"
      - run: ping ${{ vars.SQL_SERVER }} -4 -c 4
      - uses: actions/checkout@v5
      - uses: ./.github/actions/winrm-connect
        env:
          WIN_UN: ${{ secrets.WINRM_USER }}
          WIN_PW: ${{ secrets.WINRM_PASS }}
        with:
          server_name: ${{ vars.SQL_SERVER }}
