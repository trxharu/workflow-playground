on:
  workflow_call:
    inputs:
      server_name:
        required: true
        type: string
jobs:
  winrm-connect:
    runs-on: self-hosted
    steps:
      - name: Execute Powershell
        run: |
          # Write a temporary Python script to perform the WinRM operation
          cat <<EOF > winrm_script.py
          import winrm
          import os

          username = os.environ['WIN_UN']
          password = os.environ['WIN_PW']
          session = winrm.Session(f"http://${{ inputs.server_name }}:5985/wsman", auth=(username, password))

          # Run a command (e.g., get hostname)
          result = session.run('hostname')

          print("STDOUT:", result.std_out.decode('utf-8'))
          print("STDERR:", result.std_err.decode('utf-8'))

          if result.status_code != 0:
              raise Exception(f"Command failed with status code {result.status_code}")
          EOF

          # Run the script, passing secrets as environment variables
          python3 winrm_script.py
